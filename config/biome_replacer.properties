# Apocalypse Industries + Terralith varied apocalypse remapping
# Biome Replacer configuration
#
# Goal:
# - Keep the world clearly post-apocalyptic
# - Avoid one endless Wasteland biome
# - Preserve Terralith's naturally arid, rocky, canyon, mesa, volcanic and glacial terrain
# - Convert lush/green biomes into barren, dry, cold or rocky Biomes O' Plenty equivalents
# - Allow selected Terralith "rare treat" biomes to remain native;
#   their rarity/size should be controlled by BCE instead.
#
# Verified BOP biome ids used here include:
# wasteland, wasteland_steppe, dryland, scrubland,
# cold_desert, crag, dune_beach, volcanic_plains

# ============================================================
# VANILLA -> VARIED APOCALYPSE
# ============================================================

# Plains / open country
minecraft:plains > biomesoplenty:wasteland
minecraft:sunflower_plains > biomesoplenty:dryland
minecraft:snowy_plains > biomesoplenty:cold_desert
minecraft:ice_spikes > biomesoplenty:cold_desert

# Wetlands
minecraft:swamp > biomesoplenty:wasteland
minecraft:mangrove_swamp > biomesoplenty:wasteland

# Forests
minecraft:forest > biomesoplenty:wasteland
minecraft:flower_forest > biomesoplenty:dryland
minecraft:birch_forest > biomesoplenty:wasteland_steppe
minecraft:dark_forest > biomesoplenty:wasteland
minecraft:old_growth_birch_forest > biomesoplenty:wasteland_steppe

# Taiga / cold forest
minecraft:old_growth_pine_taiga > biomesoplenty:cold_desert
minecraft:old_growth_spruce_taiga > biomesoplenty:cold_desert
minecraft:taiga > biomesoplenty:wasteland_steppe
minecraft:snowy_taiga > biomesoplenty:cold_desert

# Savanna / dry terrain
minecraft:savanna > biomesoplenty:dryland
minecraft:savanna_plateau > biomesoplenty:scrubland
minecraft:windswept_savanna > biomesoplenty:crag

# Hills / mountains
#minecraft:windswept_hills > biomesoplenty:crag
#minecraft:windswept_gravelly_hills > biomesoplenty:crag
minecraft:windswept_forest > biomesoplenty:crag

# Jungle
minecraft:jungle > biomesoplenty:scrubland
minecraft:sparse_jungle > biomesoplenty:dryland
minecraft:bamboo_jungle > biomesoplenty:scrubland

# Highlands / groves
minecraft:meadow > biomesoplenty:wasteland_steppe
minecraft:cherry_grove > biomesoplenty:wasteland_steppe
minecraft:grove > biomesoplenty:wasteland_steppe

# Rivers
#minecraft:river > biomesoplenty:wasteland
minecraft:frozen_river > biomesoplenty:cold_desert

# Beaches
minecraft:beach > biomesoplenty:dune_beach
minecraft:snowy_beach > biomesoplenty:cold_desert

# Special
minecraft:mushroom_fields > biomesoplenty:wasteland

# Snowy mountains
minecraft:snowy_slopes > biomesoplenty:cold_desert
minecraft:frozen_peaks > biomesoplenty:crag
minecraft:jagged_peaks > biomesoplenty:crag

# Badlands
minecraft:wooded_badlands > biomesoplenty:dryland

# Oceans
minecraft:frozen_ocean > minecraft:ocean
minecraft:deep_frozen_ocean > minecraft:deep_ocean


